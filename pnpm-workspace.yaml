# Build scripts of dependencies stay off. These packages work without them:
# - esbuild (a dependency of tsx): the binary comes from its platform package.
# - @google/genai and protobufjs (dependencies of the TanStack AI Gemini adapter): only their
#   types are used here.
allowBuilds:
  esbuild: false
  '@google/genai': false
  protobufjs: false

# The SDK packages are only used for their types, so their new versions install at once. All other
# packages (build and test tools, whose code runs in CI) keep the default minimum release age.
minimumReleaseAgeExclude:
  - ai
  - '@ai-sdk/*'
  - '@tanstack/ai'
  - '@tanstack/ai-*'
